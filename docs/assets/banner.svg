<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="NoEnv — run commands with secrets, without committing secrets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0d5b54"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="120" cy="60" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="1090" cy="320" r="200" fill="#5eead4" opacity="0.06"/>
  <circle cx="980" cy="40" r="80" fill="#a78bfa" opacity="0.07"/>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="url(#word)">NoEnv</text>

  <text x="600" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#cbd5e1">Run commands with secrets, without committing secrets.</text>

  <!-- terminal pill -->
  <rect x="318" y="248" width="564" height="58" rx="14" fill="#00000055" stroke="#ffffff22" stroke-width="1"/>
  <circle cx="350" cy="277" r="6" fill="#ff5f56"/>
  <circle cx="372" cy="277" r="6" fill="#ffbd2e"/>
  <circle cx="394" cy="277" r="6" fill="#27c93f"/>
  <text x="424" y="285" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="25" fill="#99f6e4"><tspan fill="#64748b">$ </tspan>noenv -- npm run dev</text>
</svg>
